{%- extends "base.html" -%}
{%- block title -%}审计日志 | SyncMaster{% endblock -%}
{%- block content -%}
<div x-data="auditPage()" x-init="load()">
<div class="page-header">
    <div>
        <h1>安全与审计日志</h1>
        <p>完整操作记录：同步、扫描、回滚、配置变更</p>
    </div>
    <div class="header-actions">
        <button class="btn btn-sm btn-outline" @click="load()"><i class="fa fa-refresh"></i> 刷新</button>
    </div>
</div>

<div class="card">
    <div class="card-body" style="padding:0;">
        <table>
            <thead>
                <tr>
                    <th style="width:130px;">时间</th>
                    <th style="width:140px;">操作</th>
                    <th>详情</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="e in entries" :key="e.time + e.action">
                    <tr>
                        <td x-text="e.time"></td>
                        <td :class="actionClass(e.action)" x-text="e.action"></td>
                        <td style="color:var(--text-3);" x-text="e.detail || '-'"></td>
                    </tr>
                </template>
                <template x-if="!loaded">
                    <tr><td colspan="3" style="text-align:center;padding:40px;color:var(--text-4);">加载中...</td></tr>
                </template>
                <template x-if="loaded && entries.length === 0">
                    <tr><td colspan="3" style="text-align:center;padding:40px;color:var(--text-4);">暂无审计日志</td></tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
</div>
<script>
function auditPage() {
    return {
        entries: [], loaded: false,
        load() {
            this.loaded = false;
            _fetch('/api/audit').then(r => r.json()).then(e => { this.entries = e; this.loaded = true; })
                .catch(() => { this.loaded = true; });
        },
        actionClass(action) {
            if (action.includes('成功')) return 'text-success';
            if (action.includes('失败') || action.includes('取消') || action.includes('删除')) return 'text-danger';
            return '';
        },
    };
}
</script>
{% endblock -%}
