{%- extends "base.html" -%}
{%- block title -%}分类管理 | SyncMaster{% endblock -%}
{%- block content -%}
<div class="page-header">
    <div>
        <h1>同步分类管理</h1>
        <p>多分类独立管理，独立路径、模式与规则配置</p>
    </div>
    <div class="header-actions">
        <button class="btn btn-sm btn-primary" onclick="openCreateCategory()"><i class="fa fa-plus"></i> 创建分类</button>
    </div>
</div>

<div id="category-list" class="category-grid">
    <!-- 动态加载 -->
</div>

<div id="category-empty" class="empty-state" style="display:none;">
    <i class="fa fa-folder-o"></i>
    <p>暂无同步分类</p>
    <button class="btn btn-primary" onclick="openCreateCategory()"><i class="fa fa-plus"></i> 创建第一个分类</button>
</div>

<!-- 创建/编辑弹窗 -->
<div id="category-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modal-title">创建同步分类</h3>
            <button class="modal-close" onclick="closeCategoryModal()"><i class="fa fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <div class="form-row">
                    <label class="form-label">分类名称</label>
                    <input type="text" class="form-input" id="cat-name" placeholder="如：核心配置">
                </div>
                <div class="form-row">
                    <label class="form-label">本地路径</label>
                    <input type="text" class="form-input" id="cat-local" placeholder="/Users/you/.hermes/config.yaml">
                </div>
                <div class="form-row">
                    <label class="form-label">服务器路径</label>
                    <input type="text" class="form-input" id="cat-remote" placeholder="/home/opc/.hermes">
                </div>
                <div class="form-row">
                    <label class="form-label">同步模式</label>
                    <select class="form-select" id="cat-mode">
                        <option value="toServer">本地 -> 服务器</option>
                        <option value="toLocal">服务器 -> 本地</option>
                        <option value="bidirectional" selected>智能双向</option>
                    </select>
                </div>
                <div class="form-row">
                    <label class="form-label">删除策略</label>
                    <select class="form-select" id="cat-delete">
                        <option value="noDelete" selected>不自动删除（推荐）</option>
                        <option value="deleteToServer">本地删除 -> 同步删除服务器</option>
                        <option value="deleteToLocal">服务器删除 -> 同步删除本地</option>
                        <option value="bidirectional">双向删除同步</option>
                        <option value="ask">发现删除时询问</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeCategoryModal()">取消</button>
            <button class="btn btn-primary" onclick="saveCategoryForm()"><i class="fa fa-save"></i> 保存</button>
        </div>
    </div>
</div>

<script>
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
const MODE_LABELS = {
    'toServer': '<span class="badge badge-blue"><i class="fa fa-arrow-up"></i> 本地->服务器</span>',
    'toLocal': '<span class="badge badge-green"><i class="fa fa-arrow-down"></i> 服务器->本地</span>',
    'bidirectional': '<span class="badge badge-purple"><i class="fa fa-exchange"></i> 智能双向</span>'
};
const CAT_ICONS = ['cube', 'puzzle-piece', 'folder-open', 'star', 'cog', 'file-text', 'database', 'clock'];

async function loadCategories() {
    try {
    const resp = await _fetch('/api/categories');
    const cats = await resp.json();
    const list = document.getElementById('category-list');
    const empty = document.getElementById('category-empty');
    if (!cats.length) { list.innerHTML = ''; empty.style.display = 'flex'; return; }
    empty.style.display = 'none';
    list.innerHTML = cats.map((c, i) => `
        <div class="category-card ${c.isEnabled ? '' : 'disabled'}">
            <div class="cat-card-header">
                <div class="cat-icon-wrap">
                    <i class="fa fa-${CAT_ICONS[i % CAT_ICONS.length]}"></i>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" ${c.isEnabled ? 'checked' : ''} onchange="toggleCategory('${esc(c.id)}', this.checked)">
                    <span></span>
                </label>
            </div>
            <div class="cat-card-body">
                <div class="cat-name">${esc(c.name)}</div>
                <div class="cat-paths">
                    <i class="fa fa-folder-o"></i> ${esc(c.localPath)}<br>
                    <i class="fa fa-server"></i> ${esc(c.remotePath)}
                </div>
                <div class="cat-meta">
                    ${MODE_LABELS[c.mode] || esc(c.mode)}
                    <span class="cat-last-sync">上次: ${esc(c.lastSync)}</span>
                </div>
            </div>
            <div class="cat-card-footer">
                <button class="btn btn-sm btn-outline" onclick="syncCategory('${esc(c.id)}','${esc(c.mode)}')"><i class="fa fa-play"></i> 同步</button>
                <button class="btn btn-sm btn-outline" onclick="editCategory('${esc(c.id)}')"><i class="fa fa-edit"></i> 编辑</button>
                <button class="btn btn-sm btn-danger-outline" onclick="deleteCategory('${esc(c.id)}','${esc(c.name)}')"><i class="fa fa-trash"></i> 删除</button>
            </div>
        </div>
    `).join('');
    } catch(e) { console.error('loadCategories', e); }
}

function syncCategory(id, mode) {
    const dir = mode === 'toServer' ? 'push' : mode === 'toLocal' ? 'pull' : 'bidirectional';
    _fetch('/sync?target=' + encodeURIComponent(id) + '&dir=' + dir, { method: 'POST' });
}

async function toggleCategory(id, enabled) {
    await _fetch(`/api/category/toggle?id=${encodeURIComponent(id)}&enabled=${enabled ? 1 : 0}`, { method: 'POST' });
}

async function deleteCategory(id, name) {
    if (!confirm(`确认删除分类「${name}」？相关数据也会被清除。`)) return;
    await _fetch(`/api/category/delete?id=${encodeURIComponent(id)}`, { method: 'POST' });
    loadCategories();
}

let editingId = null;

function openCreateCategory() {
    editingId = null;
    document.getElementById('modal-title').textContent = '创建同步分类';
    document.getElementById('cat-name').value = '';
    document.getElementById('cat-local').value = '';
    document.getElementById('cat-remote').value = '';
    document.getElementById('cat-mode').value = 'bidirectional';
    document.getElementById('cat-delete').value = 'noDelete';
    document.getElementById('category-modal').style.display = 'flex';
}

async function editCategory(id) {
    const resp = await _fetch('/api/categories');
    const cats = await resp.json();
    const c = cats.find(x => x.id === id);
    if (!c) return;
    editingId = id;
    document.getElementById('modal-title').textContent = '编辑分类';
    document.getElementById('cat-name').value = c.name;
    document.getElementById('cat-local').value = c.localPath;
    document.getElementById('cat-remote').value = c.remotePath;
    document.getElementById('cat-mode').value = c.mode;
    document.getElementById('cat-delete').value = c.deletePolicy;
    document.getElementById('category-modal').style.display = 'flex';
}

function closeCategoryModal() {
    document.getElementById('category-modal').style.display = 'none';
}

async function saveCategoryForm() {
    const cat = {
        name: document.getElementById('cat-name').value.trim(),
        localPath: document.getElementById('cat-local').value.trim(),
        remotePath: document.getElementById('cat-remote').value.trim(),
        mode: document.getElementById('cat-mode').value,
        deletePolicy: document.getElementById('cat-delete').value,
        isEnabled: true,
        lastSync: '-',
        files: [],
    };
    if (editingId) { cat.id = editingId; cat._edit = true; }
    if (!cat.name) { alert('请输入分类名称'); return; }
    await _fetch('/api/category/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cat),
    });
    closeCategoryModal();
    loadCategories();
}

document.addEventListener('DOMContentLoaded', loadCategories);
</script>
{% endblock -%}
