{%- extends "base.html" -%}
{%- block title -%}同步任务 | SyncMaster{% endblock -%}
{%- block content -%}
<div x-data="categoriesPage()" x-init="load()">
<div class="page-header">
    <div>
        <h1>同步任务管理</h1>
        <p>多任务独立管理，支持不同路径、模式与规则配置</p>
    </div>
    <div class="header-actions">
        <button class="btn btn-sm btn-primary" @click="openCreate()"><i class="fa fa-plus"></i> 创建任务</button>
    </div>
</div>

<div class="category-grid">
    <template x-for="(c, i) in cats" :key="c.id">
        <div class="category-card" :class="{ disabled: !c.isEnabled }">
            <div class="cat-card-header">
                <div class="cat-icon-wrap"><i class="fa" :class="'fa-' + (ICONS[i % ICONS.length])"></i></div>
                <label class="toggle-switch"><input type="checkbox" :checked="c.isEnabled" @change="toggle(c.id, $event.target.checked)"><span></span></label>
            </div>
            <div class="cat-card-body">
                <div class="cat-name" x-text="c.name"></div>
                <div class="cat-paths">
                    <i class="fa fa-folder-o"></i> <span x-text="c.localPath"></span><br>
                    <i class="fa fa-server"></i> <span x-text="c.remotePath"></span>
                </div>
                <div class="cat-meta">
                    <span x-html="modeLabel(c.mode)"></span>
                    <span class="cat-last-sync">上次: <span x-text="c.lastSync"></span></span>
                </div>
            </div>
            <div class="cat-card-footer">
                <button class="btn btn-sm btn-outline" @click="sync(c)"><i class="fa fa-play"></i> 同步</button>
                <button class="btn btn-sm btn-outline" @click="edit(c.id)"><i class="fa fa-edit"></i> 编辑</button>
                <button class="btn btn-sm btn-danger-outline" @click="remove(c.id, c.name)"><i class="fa fa-trash"></i> 删除</button>
            </div>
        </div>
    </template>
</div>

<template x-if="loaded && cats.length === 0">
    <div class="empty-state">
        <i class="fa fa-folder-o"></i>
        <p>暂无同步任务</p>
        <button class="btn btn-primary" @click="openCreate()"><i class="fa fa-plus"></i> 创建第一个任务</button>
    </div>
</template>

<!-- 创建/编辑弹窗 -->
<div class="modal-overlay" x-show="modalOpen" x-cloak>
    <div class="modal-box">
        <div class="modal-header">
            <h3 x-text="editingId ? '编辑任务' : '创建同步任务'"></h3>
            <button class="modal-close" @click="modalOpen = false"><i class="fa fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <div class="form-row">
                    <label class="form-label">任务名称</label>
                    <input type="text" class="form-input" x-model="form.name" placeholder="如：核心配置">
                </div>
                <div class="form-row">
                    <label class="form-label">本地路径</label>
                    <input type="text" class="form-input" x-model="form.localPath" placeholder="/Users/you/.hermes/config.yaml">
                </div>
                <div class="form-row">
                    <label class="form-label">服务器路径</label>
                    <input type="text" class="form-input" x-model="form.remotePath" placeholder="/home/opc/.hermes">
                </div>
                <div class="form-row">
                    <label class="form-label">同步模式</label>
                    <select class="form-select" x-model="form.mode">
                        <option value="toServer">本地 -> 服务器</option>
                        <option value="toLocal">服务器 -> 本地</option>
                        <option value="bidirectional" selected>智能双向</option>
                    </select>
                </div>
                <div class="form-row">
                    <label class="form-label">删除策略</label>
                    <select class="form-select" x-model="form.deletePolicy">
                        <option value="noDelete" selected>不自动删除（推荐）</option>
                        <option value="deleteToServer">本地删除 -> 同步删除服务器</option>
                        <option value="deleteToLocal">服务器删除 -> 同步删除本地</option>
                        <option value="bidirectional">双向删除同步</option>
                        <option value="ask">发现删除时询问</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" @click="modalOpen = false">取消</button>
            <button class="btn btn-primary" @click="save()"><i class="fa fa-save"></i> 保存</button>
        </div>
    </div>
</div>
</div>
<style>[x-cloak]{display:none !important;}</style>
<script>
function categoriesPage() {
    const MODE_LABELS = {
        toServer: '<span class="badge badge-blue"><i class="fa fa-arrow-up"></i> 本地->服务器</span>',
        toLocal: '<span class="badge badge-green"><i class="fa fa-arrow-down"></i> 服务器->本地</span>',
        bidirectional: '<span class="badge badge-purple"><i class="fa fa-exchange"></i> 智能双向</span>'
    };
    return {
        ICONS: ['cube', 'puzzle-piece', 'folder-open', 'star', 'cog', 'file-text', 'database', 'clock'],
        cats: [], loaded: false,
        modalOpen: false, editingId: null,
        form: { name:'', localPath:'', remotePath:'', mode:'bidirectional', deletePolicy:'noDelete', isEnabled:true, lastSync:'-', files:[] },
        load() {
            this.loaded = false;
            _fetch('/api/categories').then(r => r.json()).then(c => { this.cats = c; this.loaded = true; })
                .catch(() => { this.loaded = true; });
        },
        modeLabel(mode) { return MODE_LABELS[mode] || mode; },
        toggle(id, enabled) {
            _fetch(`/api/category/toggle?id=${encodeURIComponent(id)}&enabled=${enabled ? 1 : 0}`, { method: 'POST' })
                .then(r => r.json()).then(() => {
                    const c = this.cats.find(x => x.id === id);
                    if (c) c.isEnabled = enabled;
                }).catch(() => {});
        },
        sync(c) {
            const dir = c.mode === 'toServer' ? 'push' : c.mode === 'toLocal' ? 'pull' : 'bidirectional';
            _fetch('/sync?target=' + encodeURIComponent(c.id) + '&dir=' + dir, { method: 'POST' });
        },
        remove(id, name) {
            if (!confirm(`确认删除任务「${name}」？相关数据也会被清除。`)) return;
            _fetch(`/api/category/delete?id=${encodeURIComponent(id)}`, { method: 'POST' }).then(() => this.load());
        },
        openCreate() {
            this.editingId = null;
            this.form = { name:'', localPath:'', remotePath:'', mode:'bidirectional', deletePolicy:'noDelete', isEnabled:true, lastSync:'-', files:[] };
            this.modalOpen = true;
        },
        edit(id) {
            const c = this.cats.find(x => x.id === id);
            if (!c) return;
            this.editingId = id;
            this.form = { name:c.name, localPath:c.localPath, remotePath:c.remotePath, mode:c.mode, deletePolicy:c.deletePolicy, isEnabled:c.isEnabled, lastSync:c.lastSync, files:[] };
            this.modalOpen = true;
        },
        save() {
            if (!this.form.name.trim()) { alert('请输入任务名称'); return; }
            const cat = Object.assign({}, this.form);
            if (this.editingId) { cat.id = this.editingId; cat._edit = true; }
            _fetch('/api/category/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cat) })
                .then(() => { this.modalOpen = false; this.load(); });
        },
    };
}
</script>
{% endblock -%}
