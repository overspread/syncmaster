{%- extends "base.html" -%}
{%- block title -%}历史记录 | SyncMaster{% endblock -%}
{%- block content -%}
<div x-data="historyPage()" x-init="load()">
<div class="page-header">
    <div>
        <h1>同步历史记录</h1>
        <p>完整的同步操作记录与结果追踪</p>
    </div>
    <div class="header-actions">
        <select class="form-select" x-model="filter" @change="load()" style="width:auto;min-width:130px;">
            <option value="0">全部</option>
            <option value="1">今天</option>
            <option value="2">最近 7 天</option>
            <option value="3">最近 30 天</option>
        </select>
        <button class="btn btn-sm btn-danger-outline" @click="clear()"><i class="fa fa-trash"></i> 清空历史</button>
    </div>
</div>

<div class="card">
    <div class="card-body" style="padding:0;">
        <table>
            <thead>
                <tr>
                    <th style="width:130px;">时间</th>
                    <th style="width:120px;">任务</th>
                    <th style="width:120px;">方向</th>
                    <th style="width:70px;">文件数</th>
                    <th style="width:70px;">耗时</th>
                    <th style="width:80px;">结果</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="e in entries" :key="e.time">
                    <tr>
                        <td x-text="e.time"></td>
                        <td x-text="e.category"></td>
                        <td style="color:var(--info);" x-text="e.direction"></td>
                        <td x-text="e.fileCount"></td>
                        <td x-text="e.duration || '-'"></td>
                        <td>
                            <template x-if="e.result === '成功'"><span class="status-ok"><i class="fa fa-check"></i> 成功</span></template>
                            <template x-if="e.result !== '成功'"><span class="status-fail"><i class="fa fa-times"></i> 失败</span></template>
                        </td>
                    </tr>
                </template>
                <template x-if="!loaded">
                    <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-4);">加载中...</td></tr>
                </template>
                <template x-if="loaded && entries.length === 0">
                    <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-4);">暂无记录</td></tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
</div>
<script>
function historyPage() {
    return {
        filter: '0', entries: [], loaded: false,
        load() {
            this.loaded = false;
            _fetch('/api/history?filter=' + encodeURIComponent(this.filter))
                .then(r => r.json()).then(e => { this.entries = e; this.loaded = true; })
                .catch(() => { this.loaded = true; });
        },
        clear() {
            if (!confirm('确认清空所有历史记录？此操作不可撤销。')) return;
            _fetch('/api/history/clear', { method: 'POST' }).then(() => this.load());
        },
    };
}
</script>
{% endblock -%}
