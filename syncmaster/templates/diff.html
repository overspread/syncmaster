{%- extends "base.html" -%}
{%- block title -%}差异对比 | SyncMaster{% endblock -%}
{%- block content -%}
<div x-data="diffPage()">

    <!-- ════════ 顶部控制栏与统计胶囊 ════════ -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <button class="filter-pill" :class="activeFilter === 'all' ? 'active' : ''" @click="activeFilter = 'all'">
                <span>全部</span>
                <span class="count-tag" x-text="files.length">23</span>
            </button>
            <button class="filter-pill pill-add" :class="activeFilter === 'add' ? 'active' : ''" @click="activeFilter = 'add'">
                <span class="dot-badge green"></span>
                <span>新增</span>
                <span class="count-tag" x-text="countAdd">12</span>
            </button>
            <button class="filter-pill pill-modify" :class="activeFilter === 'modify' ? 'active' : ''" @click="activeFilter = 'modify'">
                <span class="dot-badge yellow"></span>
                <span>修改</span>
                <span class="count-tag" x-text="countModify">8</span>
            </button>
            <button class="filter-pill pill-conflict" :class="activeFilter === 'conflict' ? 'active' : ''" @click="activeFilter = 'conflict'">
                <span class="dot-badge red"></span>
                <span>冲突</span>
                <span class="count-tag" x-text="countConflict">2</span>
            </button>
            <button class="filter-pill pill-ignore" :class="activeFilter === 'ignore' ? 'active' : ''" @click="activeFilter = 'ignore'">
                <span class="dot-badge gray"></span>
                <span>忽略</span>
                <span class="count-tag" x-text="countIgnore">6</span>
            </button>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
            <button class="btn-pill-outline btn-warning-ghost" @click="openEnvDiff()" title="智能比对本地与远端 .env 键值">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>.env 智能比对</span>
            </button>
            <button class="btn-pill-outline" @click="refreshDiff()" title="重新扫描本地与服务器差异">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
                <span>重新扫描</span>
            </button>
        </div>
    </div>

    <!-- ════════ 差异文件比对大表格 ════════ -->
    <div class="table-card">
        <div class="history-table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th style="width: 40px; text-align: center;">
                            <input type="checkbox" :checked="isAllSelected" @change="toggleSelectAll($event)">
                        </th>
                        <th>文件名</th>
                        <th style="width: 100px;">类型</th>
                        <th style="width: 140px;">本地修改</th>
                        <th style="width: 140px;">服务器修改</th>
                        <th style="width: 130px; text-align: right;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="(file, idx) in filteredFiles" :key="idx">
                        <tr>
                            <td style="text-align: center;">
                                <input type="checkbox" :disabled="file.type === 'ignore'" x-model="file.checked">
                            </td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
                                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; color: #FFF;" x-text="file.path"></span>
                                </div>
                            </td>
                            <td>
                                <span :class="'type-badge badge-' + file.type" x-text="file.typeName || file.type"></span>
                            </td>
                            <td class="time-cell" x-text="file.localTime"></td>
                            <td class="time-cell" x-text="file.remoteTime"></td>
                            <td style="text-align: right;">
                                <template x-if="file.action === 'upload'">
                                    <span class="btn-action-tag action-upload">
                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                                        上传
                                    </span>
                                </template>
                                <template x-if="file.action === 'download'">
                                    <span class="btn-action-tag action-download">
                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                                        下载
                                    </span>
                                </template>
                                <template x-if="file.action === 'conflict'">
                                    <button class="btn-action-tag action-conflict" @click="resolveConflict(file)">
                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                        解决冲突
                                    </button>
                                </template>
                                <template x-if="file.action === 'delete'">
                                    <span class="btn-action-tag action-delete">删除</span>
                                </template>
                                <template x-if="file.action === 'ignore'">
                                    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px;">
                                        <span style="font-size: 11px; color: var(--text-muted);" x-text="file.path.includes('.env') ? '智能保护' : '已忽略'"></span>
                                        <template x-if="file.path.includes('.env')">
                                            <button class="btn-action-tag" style="background: rgba(245,158,11,0.15); color: #FBBF24; border: 1px solid rgba(245,158,11,0.3); cursor: pointer;" @click="openEnvDiff()">
                                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                                比对键值
                                            </button>
                                        </template>
                                    </div>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- 表格底栏操作条 -->
        <div class="diff-footer-bar">
            <div class="diff-summary-text">
                共 <span style="color:#FFF; font-weight:700;" x-text="files.length">23</span> 个变化，已选择 <span style="color:#60A5FA; font-weight:700;" x-text="selectedCount">21</span> 个文件
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn-pill-secondary" @click="location.href='/'">取消</button>
                <button class="btn-pill-primary" style="padding: 8px 24px;" @click="executeSelectedSync()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <span>开始同步</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ════════ .env 智能比对与安全合并弹窗 ════════ -->
    <div class="modal-backdrop" x-show="envModalOpen" x-cloak x-transition.opacity>
        <div class="modal-panel" style="width: 780px; max-height: 85vh; display: flex; flex-direction: column;" @click.outside="envModalOpen = false" x-show="envModalOpen" x-transition:enter="modal-enter" x-transition:leave="modal-leave">
            <div class="modal-header-bar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="background: rgba(245, 158, 11, 0.15); color: #FBBF24; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="modal-title">.env 环境变量智能比对与合并</h3>
                        <div style="font-size: 11px; color: var(--text-muted); margin-top: 1px;">安全隔离机器人 ID 与敏感密钥，支持逐项选择合并</div>
                    </div>
                </div>
                <button class="modal-close-btn" @click="envModalOpen = false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <!-- 状态信息条 -->
            <div style="padding: 12px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; font-size: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span :style="'color:' + (envData && envData.localExists ? '#34D399' : '#F87171')">
                        ● 本地 .env: <strong x-text="envData && envData.localExists ? '存在' : '缺失'"></strong>
                    </span>
                    <span class="status-divider">·</span>
                    <span :style="'color:' + (envData && envData.remoteExists ? '#34D399' : 'var(--text-muted)')">
                        ● 远端 .env: <strong x-text="envData && envData.remoteExists ? '存在' : '未连接/缺失'"></strong>
                    </span>
                </div>
                <button class="btn-pill-outline" style="padding: 4px 10px; font-size: 11px;" @click="protectBotsAndKeepLocal()">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    一键保护机器人配置
                </button>
            </div>

            <!-- Key-Value 表格主体 -->
            <div style="flex: 1; overflow-y: auto; padding: 12px 20px; max-height: 420px;">
                <template x-if="envLoading">
                    <div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px;">
                        正在读取与比对两端 .env 内容...
                    </div>
                </template>
                <template x-if="!envLoading && (!envData || !envData.items || envData.items.length === 0)">
                    <div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px;">
                        本地与远端暂无环境变量文件或键值为空
                    </div>
                </template>
                <table class="custom-table" x-show="!envLoading && envData && envData.items && envData.items.length > 0" style="font-size: 12px;">
                    <thead>
                        <tr>
                            <th>配置项 (KEY)</th>
                            <th>本地值 (Local)</th>
                            <th>服务器值 (Remote)</th>
                            <th style="width: 130px; text-align: right;">操作策略</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="item in (envData ? envData.items : [])" :key="item.key">
                            <tr>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <strong style="font-family: 'JetBrains Mono', monospace; color: #FFF;" x-text="item.key"></strong>
                                        <span x-show="item.isBotRelated" class="settings-tag-badge" style="background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3);">BOT 专属</span>
                                        <span x-show="item.isSensitive && !item.isBotRelated" class="settings-tag-badge" style="background: rgba(245,158,11,0.15); color: #FBBF24; border: 1px solid rgba(245,158,11,0.3);">敏感项</span>
                                    </div>
                                </td>
                                <td>
                                    <span style="font-family: 'JetBrains Mono', monospace; color: var(--text-secondary);" x-text="item.localVal || '(空)'"></span>
                                </td>
                                <td>
                                    <span style="font-family: 'JetBrains Mono', monospace; color: var(--text-secondary);" x-text="item.remoteVal || '(空)'"></span>
                                </td>
                                <td style="text-align: right;">
                                    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px;">
                                        <button class="btn-pill-outline" :class="item.chosen === 'remote' ? 'active' : ''" style="padding: 3px 8px; font-size: 11px;" @click="item.chosen = (item.chosen === 'remote' ? 'local' : 'remote')">
                                            <span x-text="item.chosen === 'remote' ? '采用服务器' : '保留本地'"></span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- 底部保存条 -->
            <div class="modal-footer-bar" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 11px; color: var(--text-muted);">
                    保存时将自动对原本地 .env 创建安全快照备份
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="btn-pill-secondary" @click="envModalOpen = false">取消</button>
                    <button class="btn-pill-primary" :disabled="envSaving" @click="saveEnvMerge()">
                        <span x-text="envSaving ? '保存中...' : '安全合并到本地'"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<style>
/* 差异筛选胶囊 */
.filter-pill {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-pill);
    padding: 6px 14px;
    font-size: 12.5px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: var(--transition);
}
.filter-pill:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FFF;
}
.filter-pill.active {
    background: rgba(59, 130, 246, 0.15);
    border-color: rgba(59, 130, 246, 0.45);
    color: #60A5FA;
    font-weight: 600;
}
.count-tag {
    font-size: 11px;
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 6px;
    border-radius: 9999px;
}

.dot-badge {
    width: 6px;
    height: 6px;
    border-radius: 50%;
}
.dot-badge.green { background: var(--brand-green); box-shadow: 0 0 6px var(--brand-green); }
.dot-badge.yellow { background: var(--brand-amber); box-shadow: 0 0 6px var(--brand-amber); }
.dot-badge.red { background: var(--brand-red); box-shadow: 0 0 6px var(--brand-red); }
.dot-badge.gray { background: var(--text-muted); }

/* 类型徽章 */
.type-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
}
.badge-add { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
.badge-modify { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.3); }
.badge-conflict { background: rgba(239, 68, 68, 0.15); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.3); }
.badge-delete { background: rgba(239, 68, 68, 0.1); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.2); }
.badge-ignore { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-subtle); }

/* 操作指示标签/按钮 */
.btn-action-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: default;
}
.action-upload { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
.action-download { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
.action-conflict { background: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.4); cursor: pointer; }
.action-conflict:hover { background: rgba(239, 68, 68, 0.35); }
.action-delete { background: rgba(239, 68, 68, 0.12); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.25); }

/* 底部操作条 */
.diff-footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 8px 6px 8px;
    border-top: 1px solid var(--border-subtle);
}
.diff-summary-text {
    font-size: 13px;
    color: var(--text-secondary);
}
.btn-pill-secondary {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-card);
    color: var(--text-secondary);
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
}
.btn-pill-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #FFF;
}
.btn-pill-outline {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border-card);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    font-size: 12.5px;
    cursor: pointer;
    transition: var(--transition);
}
.btn-pill-outline:hover {
    border-color: #60A5FA;
    color: #FFF;
}
</style>

<script>
function diffPage() {
    return {
        activeFilter: 'all',
        files: [],
        envModalOpen: false,
        envLoading: false,
        envData: null,
        envSaving: false,

        init() {
            this.refreshDiff();
        },

        refreshDiff() {
            _fetch('/api/diff').then(r => r.json()).then(d => {
                if (d && Array.isArray(d.files)) {
                    this.files = d.files;
                }
            }).catch(() => {});
        },

        get filteredFiles() {
            if (this.activeFilter === 'all') return this.files;
            return this.files.filter(f => f.type === this.activeFilter);
        },

        get countAdd() { return this.files.filter(f => f.type === 'add').length; },
        get countModify() { return this.files.filter(f => f.type === 'modify').length; },
        get countConflict() { return this.files.filter(f => f.type === 'conflict').length; },
        get countIgnore() { return this.files.filter(f => f.type === 'ignore').length; },

        get selectedCount() {
            return this.files.filter(f => f.checked).length;
        },

        get isAllSelected() {
            const selectable = this.files.filter(f => f.type !== 'ignore');
            return selectable.length > 0 && selectable.every(f => f.checked);
        },

        toggleSelectAll(e) {
            const checked = e.target.checked;
            this.files.forEach(f => {
                if (f.type !== 'ignore') f.checked = checked;
            });
        },

        resolveConflict(file) {
            const choice = confirm(`【冲突检测】文件: ${file.path}\n\n点击【确定】以【本地版本】覆盖服务器\n点击【取消】以【服务器版本】覆盖本地`);
            if (choice) {
                file.action = 'upload';
                file.typeName = '本地优先';
                file.type = 'modify';
                file.checked = true;
            } else {
                file.action = 'download';
                file.typeName = '服务器优先';
                file.type = 'modify';
                file.checked = true;
            }
        },

        executeSelectedSync() {
            const selected = this.files.filter(f => f.checked && f.type !== 'ignore').map(f => f.path);
            if (selected.length === 0) {
                alert('请至少勾选一个需要同步的文件');
                return;
            }
            _fetch('/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    target: 'core',
                    dir: 'bidirectional',
                    files: selected
                })
            }).then(r => r.json()).then(d => {
                if (d.ok) {
                    Alpine.store('sync').refresh();
                    setTimeout(() => {
                        location.href = '/';
                    }, 500);
                } else {
                    alert('同步启动失败: ' + (d.message || '未知错误'));
                }
            }).catch(() => alert('请求失败，服务未响应'));
        },

        // ── .env 智能比对与合并 ──
        openEnvDiff() {
            this.envModalOpen = true;
            this.envLoading = true;
            _fetch('/api/env/diff?id=core').then(r => r.json()).then(d => {
                this.envLoading = false;
                if (d.ok) {
                    if (d.items) {
                        d.items.forEach(item => {
                            // 默认策略：机器人配置或敏感项或本地专属强保护保留本地
                            item.chosen = (item.isBotRelated || item.isSensitive || item.status === 'local_only') ? 'local' : (item.status === 'remote_only' ? 'remote' : 'local');
                        });
                    }
                    this.envData = d;
                } else {
                    alert(d.message || '读取 .env 差异失败');
                }
            }).catch(() => { this.envLoading = false; });
        },

        protectBotsAndKeepLocal() {
            if (!this.envData || !this.envData.items) return;
            this.envData.items.forEach(item => {
                if (item.isBotRelated || item.isSensitive || item.key.toUpperCase().includes('BOT')) {
                    item.chosen = 'local';
                }
            });
            alert('已将所有机器人 (BOT) 相关及敏感配置设为保留本地保护');
        },

        saveEnvMerge() {
            if (!this.envData || !this.envData.items) return;
            this.envSaving = true;
            const merges = this.envData.items.map(item => ({
                key: item.key,
                value: item.chosen === 'remote' ? item.remoteVal : item.localVal
            }));
            _fetch('/api/env/merge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    categoryId: this.envData.categoryId,
                    merges: merges
                })
            }).then(r => r.json()).then(d => {
                this.envSaving = false;
                if (d.ok) {
                    alert('✅ 环境变量已安全合并并创建了备份快照！');
                    this.envModalOpen = false;
                    this.refreshDiff();
                } else {
                    alert('保存合并失败: ' + (d.message || '未知错误'));
                }
            }).catch(() => {
                this.envSaving = false;
                alert('请求失败');
            });
        }
    };
}
</script>
{% endblock %}
