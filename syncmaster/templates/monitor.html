{%- extends "base.html" -%}
{%- block title -%}监控面板 | SyncMaster{% endblock -%}
{%- block content -%}
<div class="page-header">
    <div>
        <h1>实时监控面板</h1>
        <p>同步进度、速率、文件处理实时状态</p>
    </div>
    <div class="header-actions">
        <a href="/categories" class="btn btn-sm btn-primary" style="text-decoration:none;"><i class="fa fa-tasks"></i> 管理同步任务</a>
        <button class="btn btn-sm btn-danger-outline" id="btn-stop" x-show="$store.sync.running" @click="$store.sync.cancel($el)" x-cloak><i class="fa fa-stop"></i> 停止</button>
    </div>
</div>

<!-- 监控指标 -->
<div class="monitor-grid">
    <div class="stat-card">
        <i class="fa fa-tachometer stat-icon"></i>
        <div class="stat-content">
            <div class="stat-value" x-text="$store.sync.stats.speed || '0 KB/s'"></div>
            <div class="stat-label">实时速率</div>
        </div>
    </div>
    <div class="stat-card">
        <i class="fa fa-file-text stat-icon"></i>
        <div class="stat-content">
            <div class="stat-value"><span x-text="$store.sync.stats.done || 0"></span>/<span x-text="Math.max($store.sync.stats.total || 0, $store.sync.stats.done || 0)"></span></div>
            <div class="stat-label">已处理文件</div>
        </div>
    </div>
    <div class="stat-card">
        <i class="fa fa-check-circle stat-icon"></i>
        <div class="stat-content">
            <div class="stat-value" x-text="Math.round($store.sync.stats.percent || 0) + '%'"></div>
            <div class="stat-label">完成进度</div>
        </div>
    </div>
    <div class="stat-card">
        <i class="fa fa-clock-o stat-icon"></i>
        <div class="stat-content">
            <div class="stat-value" x-text="$store.sync.stats.eta || '--:--'"></div>
            <div class="stat-label">预计剩余</div>
        </div>
    </div>
</div>

<!-- 进度条 -->
<div class="card">
    <div class="card-header">
        <h3>同步进度</h3>
        <span class="monitor-status" x-text="$store.sync.stats.status || '就绪'"></span>
    </div>
    <div class="card-body">
        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" :style="`width:${$store.sync.stats.percent || 0}%`"></div>
        </div>
        <div class="progress-current-file" x-text="$store.sync.stats.currentFile || '等待开始...'"></div>
        <div class="progress-counters">
            <span class="counter-up"><i class="fa fa-arrow-up"></i> <span x-text="$store.sync.stats.uploaded || 0"></span></span>
            <span class="counter-down"><i class="fa fa-arrow-down"></i> <span x-text="$store.sync.stats.downloaded || 0"></span></span>
        </div>
    </div>
</div>

<!-- 实时日志 -->
<div class="card">
    <div class="card-header">
        <h3>同步执行日志</h3>
        <button class="btn btn-sm btn-outline" @click="$store.sync.logLines = []; window.sessionStorage.removeItem('sm_log')"><i class="fa fa-eraser"></i> 清空</button>
    </div>
    <div class="card-body" style="padding:0;">
        <div id="live-log" class="live-log-area" x-effect="$el.textContent = $store.sync.logLines.join('\n'); $el.scrollTop = $el.scrollHeight"></div>
    </div>
</div>

<style>
[x-cloak] { display: none !important; }
.monitor-status.status-success { color: var(--success); }
.monitor-status.status-fail { color: var(--danger); }
.monitor-status.status-running { color: var(--info); }
</style>
<script>
// 监控页状态颜色由 Alpine 计算
document.addEventListener('alpine:initialized', () => {
    Alpine.effect(() => {
        const s = Alpine.store('sync').stats.status || '';
        const el = document.querySelector('.monitor-status');
        if (!el) return;
        el.classList.remove('status-success', 'status-fail', 'status-running');
        if (s.includes('完成') || s.includes('成功')) el.classList.add('status-success');
        else if (s.includes('失败') || s.includes('取消') || s.includes('停止')) el.classList.add('status-fail');
        else if (s.includes('中')) el.classList.add('status-running');
    });
});
</script>
{% endblock -%}
