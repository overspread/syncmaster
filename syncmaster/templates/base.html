<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SyncMaster{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-layout">
{% block sidebar %}
<aside class="sidebar">
    <div class="sidebar-brand">
        <i class="fa fa-cloud"></i>
        <span class="brand-name">SyncMaster</span>
        <span class="brand-version">v1.0</span>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">
            <a href="/" class="nav-item {% if request_path == '/' %}active{% endif %}"><i class="fa fa-th-large"></i> 概览</a>
            <a href="/monitor" class="nav-item {% if request_path == '/monitor' %}active{% endif %}"><i class="fa fa-tachometer"></i> 监控面板</a>
            <a href="/categories" class="nav-item {% if request_path == '/categories' %}active{% endif %}"><i class="fa fa-tags"></i> 分类管理</a>
        </div>
        <div class="nav-section">
            <a href="/history" class="nav-item {% if request_path == '/history' %}active{% endif %}"><i class="fa fa-history"></i> 历史记录</a>
            <a href="/backup" class="nav-item {% if request_path == '/backup' %}active{% endif %}"><i class="fa fa-undo"></i> 备份回滚</a>
            <a href="/audit" class="nav-item {% if request_path == '/audit' %}active{% endif %}"><i class="fa fa-file-text-o"></i> 审计日志</a>
        </div>
        <div class="nav-section">
            <a href="/settings" class="nav-item {% if request_path == '/settings' %}active{% endif %}"><i class="fa fa-cog"></i> 设置</a>
        </div>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar"><i class="fa fa-user"></i></div>
        <div class="user-info">
            <div class="user-name">Overspread</div>
            <div class="user-status"><span class="dot online"></span> 已连接</div>
        </div>
    </div>
</aside>
{% endblock %}
<main class="main-content">
    {% block content %}{% endblock %}
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
<script>
const evt = new EventSource('/events');
evt.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'log') {
        const el = document.getElementById('live-log');
        if (el) {
            el.textContent += d.text + '\n';
            el.scrollTop = el.scrollHeight;
        }
    } else if (d.type === 'done') {
        document.querySelectorAll('.btn-primary').forEach(b => b.disabled = false);
        if (d.success) {
            document.getElementById('stat-pending') && (document.getElementById('stat-pending').textContent = '0');
        }
        if (window.location.pathname === '/') {
            setTimeout(() => location.reload(), 2000);
        }
    } else if (d.type === 'started') {
        document.querySelectorAll('.btn-primary').forEach(b => b.disabled = true);
    }
};
</script>
</body>
</html>
