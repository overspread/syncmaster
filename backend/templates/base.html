<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SyncMaster | 智能同步中心{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/layout.css">
    <link rel="stylesheet" href="/static/components.css">
    <script src="/static/app.js"></script>
    <script defer src="/static/alpinejs.min.js"></script>
</head>
<body>
<div class="app-container" x-data>
    <!-- ════════════════ 左侧边栏 ════════════════ -->
    <aside class="sidebar">
        <!-- 品牌标识 -->
        <div class="sidebar-header">
            <div class="brand-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                </svg>
            </div>
            <div class="brand-title-wrap">
                <span class="brand-title">SyncMaster</span>
                <span class="brand-badge">v1.0.0</span>
            </div>
        </div>

        <!-- 导航菜单 -->
        <nav class="sidebar-nav">
            <a href="/" class="nav-link {% if request_path == '/' or not request_path %}active{% endif %}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/>
                    <rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
                </svg>
                <span>概览</span>
            </a>
            <a href="/diff" class="nav-link {% if request_path == '/diff' %}active{% endif %}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
                </svg>
                <span>差异对比</span>
            </a>
            <a href="/categories" class="nav-link {% if request_path == '/categories' %}active{% endif %}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
                </svg>
                <span>同步分类</span>
            </a>
            <a href="/history" class="nav-link {% if request_path == '/history' %}active{% endif %}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>历史记录</span>
            </a>
            <a href="/settings" class="nav-link {% if request_path == '/settings' %}active{% endif %}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>设置</span>
            </a>
        </nav>

        <!-- 底部存储空间与用户状态 -->
        <div class="sidebar-footer">
            <div class="storage-box">
                <div class="storage-title-row">
                    <span>存储空间</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
                        <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                    </svg>
                </div>
                
                <!-- 本地存储 -->
                <div class="storage-item">
                    <div class="storage-labels">
                        <span>本地</span>
                        <span x-text="($store.sync.local?.disk?.usedGb || '128.7') + ' GB / ' + ($store.sync.local?.disk?.totalGb || '512') + ' GB'">128.7 GB / 512 GB</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill-blue" :style="'width: ' + ($store.sync.local?.disk?.percent || 25.1) + '%'"></div>
                    </div>
                </div>

                <!-- 服务器存储 -->
                <div class="storage-item">
                    <div class="storage-labels">
                        <span>服务器</span>
                        <span>256.3 GB / 1 TB</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill-green" style="width: 25.6%;"></div>
                    </div>
                </div>
            </div>

            <!-- 用户状态 -->
            <div class="user-status-card">
                <div class="user-avatar">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="user-details">
                    <div class="user-name">Overspread</div>
                    <div class="user-status">
                        <span class="status-dot-pulse"></span>
                        <span>已连接</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- ════════════════ 右侧主工作区 ════════════════ -->
    <main class="main-viewport">
        <!-- 顶部固定粘滞 Header -->
        <header class="main-header">
            <div class="header-left">
                <div class="header-title-row">
                    <h1 class="page-title">概览</h1>
                </div>
                <div class="page-subtitle">
                    <span>本地</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--brand-blue)" stroke-width="2.5">
                        <path d="m8 3 4 4-4 4"/><path d="M12 7H4"/><path d="m16 21 4-4-4-4"/><path d="M20 17H12"/>
                    </svg>
                    <span>服务器 智能同步管理</span>
                </div>
            </div>

            <div class="header-right">
                <!-- 通知中心 -->
                <button class="header-icon-btn" title="通知消息">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                    </svg>
                    <span class="btn-badge-dot"></span>
                </button>

                <!-- 快速设置 -->
                <a href="/settings" class="header-icon-btn" title="系统设置" style="text-decoration:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </a>

                <select class="task-select" aria-label="同步任务" x-model="$store.sync.selectedCategory">
                    <option value="">选择同步任务</option>
                    <template x-for="cat in $store.sync.categories" :key="cat.id">
                        <option :value="cat.id" x-text="cat.name"></option>
                    </template>
                </select>
                <!-- 快速同步主按钮 -->
                <button class="btn-pill-primary" @click="$store.sync.start('bidirectional', $event.currentTarget)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    <span>快速同步</span>
                </button>
            </div>
        </header>

        <!-- 主体内容注入 -->
        <div class="dashboard-content">
            {% block content %}{% endblock %}
        </div>

        <!-- ════════ 全局实时同步悬浮抽屉 ════════ -->
        <template x-if="$store.sync.running">
            <div class="floating-sync-panel">
                <div class="sync-info-left">
                    <svg class="sync-spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                    <div class="sync-status-text">
                        <div class="sync-main-label">
                            <span x-text="$store.sync.stats.status || '正在进行智能同步...'"></span>
                            <span class="online-pill" style="font-size: 10px; padding: 1px 6px;">LIVE</span>
                        </div>
                        <div class="sync-file-path" x-text="$store.sync.stats.currentFile || '扫描文件比对差异中...'"></div>
                    </div>
                </div>

                <div class="sync-progress-box">
                    <div class="sync-speed-label">
                        <span x-text="$store.sync.stats.speed || '12.4 MB/s'"></span>
                        <span x-text="($store.sync.stats.percent || 0) + '%'"></span>
                    </div>
                    <div class="progress-track" style="height: 6px;">
                        <div class="progress-fill-blue" :style="'width: ' + ($store.sync.stats.percent || 0) + '%'"></div>
                    </div>
                </div>

                <button class="btn-stop-sync" @click="$store.sync.cancel($event.currentTarget)">
                    停止
                </button>
            </div>
        </template>
    </main>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.store('sync', {
        running: false,
        categories: [],
        selectedCategory: "",
        stats: { speed: '0 KB/s', done: 0, total: 0, percent: 0, status: '就绪', eta: '--:--', uploaded: 0, downloaded: 0, currentFile: '' },
        conn: { jumpOk: false, remoteOk: false },
        local: null,
        remoteConfig: null,
        diff: { pending: 0, toUpload: 0, toDownload: 0, conflicts: 0, ok: false },
        historyList: [],
        // 后台持续同步监听状态（由 /api/autosync 与 SSE autosync 事件驱动）
        autosync: { enabled: false, mode: 'poll', reason: '', lastSyncAt: 0, direction: 'bidirectional' },
        // 实时监控页的控制台流水（内存缓冲，避免页面直接读空数组）
        logLines: [],
        
        init() {
            this.refresh();
            _fetch("/api/categories").then(r => r.json()).then(rows => {
                this.categories = rows;
                if (rows.length === 1) this.selectedCategory = rows[0].id;
            });
            try {
                const es = new EventSource('/events?token=' + (window.SM_TOKEN || ''));
                es.onmessage = e => {
                    try { this.handleEvent(JSON.parse(e.data)); } catch (err) {}
                };
            } catch (e) {}
            setInterval(() => this.refresh(), 6000);
        },

        refresh() {
            _fetch('/api/local-info').then(r => r.json()).then(d => { this.local = d; }).catch(() => {});
            _fetch('/api/config').then(r => r.json()).then(d => { this.remoteConfig = d; }).catch(() => {});
            _fetch('/api/conn_status').then(r => r.json()).then(d => { this.conn = d; }).catch(() => {});
            _fetch('/api/autosync').then(r => r.json()).then(d => { if (d) this.autosync = Object.assign({}, this.autosync, d); }).catch(() => {});
            _fetch('/api/diff').then(r => r.json()).then(d => { if (d && d.ok) this.diff = d; }).catch(() => {});
            _fetch('/api/monitor').then(r => r.json()).then(d => {
                this.stats = d;
                this.running = (d.status || '').includes('中');
            }).catch(() => {});
            _fetch('/api/history').then(r => r.json()).then(d => {
                if (Array.isArray(d)) this.historyList = d.slice(0, 10);
            }).catch(() => {});
        },

        handleEvent(d) {
            if (d.type === 'stats') {
                this.stats = d.stats;
                this.running = (d.stats.status || '').includes('中');
            } else if (d.type === 'autosync') {
                this.autosync = Object.assign({}, this.autosync, d);
            } else if (d.type === 'log') {
                this.logLines.push(d.text || '');
                if (this.logLines.length > 400) this.logLines.shift();
            } else if (d.type === 'started') {
                this.running = true;
                this.refresh();
            } else if (d.type === 'done') {
                this.running = false;
                const status = this.stats.status || '';
                if (status.includes('失败') || status.includes('错误')) {
                    notify('同步失败: ' + status, 'error');
                }
                this.refresh();
            }
        },

        start(direction, btn) {
            if (this.running) return;
            if (!this.selectedCategory) { notify("请先在顶部选择同步任务", 'error'); return; }
            direction = ({toServer: "push", toLocal: "pull"})[direction] || direction;
            this.running = true;
            this.stats.status = '正在准备传输...';
            _fetch('/sync?dir=' + encodeURIComponent(direction) + '&target=' + encodeURIComponent(this.selectedCategory), { method: 'POST' })
                .then(r => r.json())
                .then(d => {
                    if (!d.ok) {
                        this.running = false;
                        notify(d.message || '启动同步失败', 'error');
                    }
                })
                .catch(() => {
                    this.running = false;
                    notify('请求失败，服务未响应', 'error');
                });
        },

        cancel(btn) {
            _fetch('/cancel', { method: 'POST' })
                .then(r => r.json())
                .then(d => {
                    if (!d.ok) notify('停止失败: ' + (d.message || '未知错误'), 'error');
                    this.running = false;
                })
                .catch(() => notify('请求失败，服务未响应', 'error'));
        }
    });
});
</script>
</body>
</html>
